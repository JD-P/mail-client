[package]
name = "async-imap"
version = "0.12.0-lizard.1"
authors = ["dignifiedquire <me@dignifiedquire.com>"]
documentation = "https://docs.rs/async-imap/"
repository = "https://github.com/chatmail/async-imap"
description = "Lizard's hardened vendored async IMAP client"
readme = "README.md"
license = "Apache-2.0"
publish = false
edition = "2024"
rust-version = "1.88"

keywords = ["email", "imap"]
categories = ["email", "network-programming"]

[features]
default = ["runtime-async-std"]
compress = ["async-compression", "pin-project"]

runtime-async-std = ["async-std", "async-compression?/futures-io"]
runtime-tokio = ["tokio", "async-compression?/tokio"]

[dependencies]
async-channel = "2.0.0"
async-compression = { version = "0.4.15", default-features = false, features = ["deflate"], optional = true }
async-std = { version = "1.8.0", default-features = false, features = ["std", "unstable"], optional = true }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = {version = "0.3.15", features = ["io"] }
imap-proto = "0.17"
log = "0.4.8"
nom = "8.0"
pin-project = { version = "1", optional = true }
self_cell = "1.0.1"
stop-token = "0.7"
thiserror = "1.0.9"
tokio = { version = "1", features = ["net", "sync", "time", "io-util"], optional = true }

[dev-dependencies]
async-std = { version = "1.8.0", features = ["std", "attributes"] }
pin-project = "1"
pretty_assertions = "1.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
