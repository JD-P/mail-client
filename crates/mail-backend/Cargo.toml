[package]
name = "lizard-mail-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Headless local mail storage, ingestion, classification, and search"

[dependencies]
async-imap = { path = "../../vendor/async-imap", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures-util = "0.3"
hex = "0.4"
html5ever = "=0.40.1"
linkify = "0.10"
mail-parser = { version = "=1.0.1", features = ["full_encoding"] }
mail-auth = { path = "../../vendor/mail-auth", default-features = false, features = ["dns-hickory", "dns-tls-ring", "rust-crypto"] }
psl = "2"
rustpython-parser = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tantivy = "=0.26.2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
turso = { version = "=0.9.0-pre.5", default-features = false, features = ["fts", "simd"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
webpki-roots = "1"
zeroize = "1"
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
