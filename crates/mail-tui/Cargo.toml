[package]
name = "lizard-mail-tui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Lizard's opinionated terminal mail client and bounded HTML renderer"
default-run = "lizard-mail-tui"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
html5ever = "=0.40.1"
lizard-mail-backend = { path = "../mail-backend" }
markup5ever_rcdom = "=0.40.1"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "=0.4.7"
libc = "0.2"

[[bin]]
name = "lizard-mail-tui-render-worker"
path = "src/bin/lizard-mail-tui-render-worker.rs"

[dev-dependencies]
ratatui = { version = "=0.30.2", default-features = false }
tempfile = "3"
