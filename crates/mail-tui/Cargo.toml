[package]
name = "lizard-mail-tui"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Lizard's opinionated terminal mail client and bounded HTML renderer"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29"
html5ever = "=0.40.1"
lizard-mail-backend = { path = "../mail-backend" }
markup5ever_rcdom = "=0.40.1"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
unicode-segmentation = "1"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
ratatui = { version = "=0.30.2", default-features = false }
tempfile = "3"
